name: Feature request
description: Describe a typography task you want to complete.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do?
      description: Describe the task and where you would use the result.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you handle it today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed interaction
      description: A sketch or screenshot can help.
